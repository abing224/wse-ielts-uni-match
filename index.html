    function StudentJourneyTracker({ userInputs = { currentLevel: 12 }, config = { targetWseLevel: 15, englishRequirementLabel: "IELTS 6.5 Overall", levels: INITIAL_LEVELS, university: "University of Melbourne" } } = {}) {
      // 1. Package state (Silver, Gold, Platinum)
      const [selectedPackage, setSelectedPackage] = React.useState(() => {
        return localStorage.getItem("indies_package") || "Platinum";
      });

      // 1b. IELTS Package state (essential, masterclass, masterclass_pro)
      const [selectedIeltsPackage, setSelectedIeltsPackage] = React.useState(() => {
        return localStorage.getItem("indies_ielts_package") || "essential";
      });

      // 1c. Questionnaire step tracker
      const [currentStep, setCurrentStep] = React.useState(1);
      const [isUniPrepListOpen, setIsUniPrepListOpen] = React.useState(false);
      const [showSummaryModal, setShowSummaryModal] = React.useState(false);

      // 2. Checked items state
      const [checkedItems, setCheckedItems] = React.useState(() => {
        try {
          const saved = localStorage.getItem("indies_checked_items");
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      // 3. Accordion state (expanded phases)
      const [expandedPhases, setExpandedPhases] = React.useState({
        select: true,
        empower: true,
        navigate: true,
        depart: true
      });

      // 4. View Mode (tracker vs builder)
      const [activeMode, setActiveMode] = React.useState(() => {
        return localStorage.getItem("indies_active_mode") || "tracker";
      });

      const currentLevelData = React.useMemo(() => {
        return config.levels.find(l => l.level === userInputs.currentLevel) || config.levels[0];
      }, [config.levels, userInputs.currentLevel]);

      // 5. Custom Builder needs
      const [builderNeeds, setBuilderNeeds] = React.useState(() => {
        try {
          const saved = localStorage.getItem("indies_builder_needs");
          const parsed = saved ? JSON.parse(saved) : null;
          return parsed 
            ? { ieltsOption: "essential", needsScholarship: false, ...parsed } 
            : { uniCount: "3", needsUniPrep: false, needsHousing: false, needsScholarship: false, ieltsOption: "essential" };
        } catch (e) {
          return { uniCount: "3", needsUniPrep: false, needsHousing: false, needsScholarship: false, ieltsOption: "essential" };
        }
      });

      React.useEffect(() => {
        localStorage.setItem("indies_package", selectedPackage);
      }, [selectedPackage]);

      React.useEffect(() => {
        localStorage.setItem("indies_ielts_package", selectedIeltsPackage);
      }, [selectedIeltsPackage]);

      React.useEffect(() => {
        localStorage.setItem("indies_checked_items", JSON.stringify(checkedItems));
      }, [checkedItems]);

      React.useEffect(() => {
        localStorage.setItem("indies_active_mode", activeMode);
      }, [activeMode]);

      React.useEffect(() => {
        localStorage.setItem("indies_builder_needs", JSON.stringify(builderNeeds));
      }, [builderNeeds]);

      const isItemAvailable = (item) => {
        if (!item.unavailableIn) return true;
        return !item.unavailableIn.includes(selectedPackage);
      };

      const handleToggleItem = (itemId, isAvailable) => {
        if (!isAvailable) return;
        setCheckedItems(prev => ({
          ...prev,
          [itemId]: !prev[itemId]
        }));
      };

      const togglePhase = (phaseId) => {
        setExpandedPhases(prev => ({
          ...prev,
          [phaseId]: !prev[phaseId]
        }));
      };

      // Recommended INDIES Package Logic
      const recommendedIndiesPackage = React.useMemo(() => {
        if (builderNeeds.uniCount === "5" || (builderNeeds.needsScholarship && builderNeeds.needsUniPrep)) {
          return "Platinum";
        } else if (builderNeeds.needsScholarship || builderNeeds.needsUniPrep) {
          return "Gold";
        } else {
          return "Silver";
        }
      }, [builderNeeds]);

      // Recommended IELTS Package Logic
      const recommendedIeltsPackage = React.useMemo(() => {
        if (builderNeeds.ieltsOption === "masterclass_pro") {
          return "IELTS Masterclass Pro";
        } else if (builderNeeds.ieltsOption === "masterclass") {
          return "IELTS Masterclass";
        } else {
          return "IELTS Essential";
        }
      }, [builderNeeds]);

      const stats = React.useMemo(() => {
        let totalActive = 0;
        let completedActive = 0;
        const phaseProgress = {};

        JOURNEY_PHASES.forEach(phase => {
          let phaseTotal = 0;
          let phaseCompleted = 0;

          phase.items.forEach(item => {
            if (isItemAvailable(item)) {
              phaseTotal++;
              totalActive++;
              if (checkedItems[item.id]) {
                phaseCompleted++;
                completedActive++;
              }
            }
          });

          phaseProgress[phase.id] = {
            total: phaseTotal,
            completed: phaseCompleted
          };
        });

        const percent = totalActive > 0 ? Math.round((completedActive / totalActive) * 100) : 0;
        return {
          total: totalActive,
          completed: completedActive,
          percent,
          phases: phaseProgress
        };

        // 1. Essay Persuasiveness (20%) — based on length, keywords
        const essayKeywords = ['passion','goal','impact','community','experience','research','future','contribute','challenge','overcome'];
        const essayKeyHits = essayKeywords.filter(k => form.essayText.toLowerCase().includes(k)).length;
        const essayLengthScore = Math.min(essayLen / 300, 1); // ideal ≥ 300 words
        const essayScore = Math.round(((essayKeyHits / essayKeywords.length) * 0.5 + essayLengthScore * 0.5) * 100);

        // 2. Profile-Program Fit (20%) — GPA/Report Card + IELTS alignment
        const gpaScore = isUndergrad 
          ? Math.min(rawAcademicScore, 100) 
          : Math.min((rawAcademicScore / 4.0) * 100, 100);
        const ieltsScore = ielts >= 7.5 ? 100 : ielts >= 7.0 ? 88 : ielts >= 6.5 ? 75 : ielts >= 6.0 ? 60 : ielts >= 5.5 ? 44 : 25;
        const fitScore = Math.round(gpaScore * 0.6 + ieltsScore * 0.4);

        // 3. Completeness & Eligibility (15%) — how much of the form is filled
        const fields = [
          form.name, form.targetCountry, form.targetProgram, form.ieltsScore, form.satScore, 
          form.essayText, form.extracurricular, form.targetScholarship,
          form.prepCountryText, form.prepCoursesText, form.prepAcadLifeText
        ];
        const filled = fields.filter(f => f && f.toString().trim().length > 0).length;
        const completenessScore = Math.round((filled / fields.length) * 100);

        // 4. Scholarship Match (10%) — financial need + target scholarship alignment
        const schMatch = (form.financialNeed ? 30 : 0) + (form.targetScholarship ? 40 : 0) + (hasWorkExp ? 30 : 0);
        const scholarshipScore = Math.min(schMatch, 100);

        // 5. Competitiveness & Differentiation (15%)
        const academicCompetitivenessPoints = isUndergrad
          ? (rawAcademicScore >= 85 ? 15 : rawAcademicScore >= 75 ? 8 : 0)
          : (rawAcademicScore >= 3.5 ? 15 : rawAcademicScore >= 3.0 ? 8 : 0);

        const compScore = Math.round(
          (hasExtracurricular ? 40 : 0) +
          (hasWorkExp ? 25 : 0) +
          (essayKeyHits >= 5 ? 20 : essayKeyHits * 4) +
          academicCompetitivenessPoints
        );

        // 6. Social & Academic Preparedness (20%)
        const countryLen = (form.prepCountryText || '').trim().split(/\s+/).filter(Boolean).length;
        const hasCountryRef = form.targetCountry && (form.prepCountryText || '').toLowerCase().includes(form.targetCountry.toLowerCase());
        const countryKeywords = ['culture', 'cultural', 'lifestyle', 'society', 'social', 'people', 'system', 'education', 'history', 'transport', 'weather', 'climate', 'living', 'cost', 'environment', 'tradition', 'customs', 'language'];
        const countryKeyHits = countryKeywords.filter(k => (form.prepCountryText || '').toLowerCase().includes(k)).length;

        let countryScore = 0;
        if (countryLen > 0) {
          if (countryLen <= 15) countryScore = 30;
          else if (countryLen <= 45) countryScore = 55;
          else if (countryLen <= 75) countryScore = 75;
          else countryScore = 85;

          if (hasCountryRef) countryScore += 10;
          countryScore += Math.min(countryKeyHits * 3, 15);
          countryScore = Math.min(countryScore, 100);
        }
        
        let countryLevel = 'Superficial';
        let countryFeedback = 'Answer is brief and lacks detail. Research the local culture, lifestyle, and education system.';
        if (countryScore >= 80) {
          countryLevel = 'Highly Well-Researched';
          countryFeedback = 'Excellent! You demonstrate a deep, nuanced understanding of the country\'s cultural and social environment.';
        } else if (countryScore >= 60) {
          countryLevel = 'Reasonably Informed';
          countryFeedback = 'Good understanding, but could include more specific observations about local lifestyle or lifestyle adaptation.';
        } else if (countryScore >= 40) {
          countryLevel = 'General';
          countryFeedback = 'Basic knowledge. Try to look beyond superficial facts and research daily life and cultural norms.';
        }

        const coursesLen = (form.prepCoursesText || '').trim().split(/\s+/).filter(Boolean).length;
        const coursesKeywords = ['module', 'course', 'credits', 'syllabus', 'curriculum', 'subject', 'class', 'professor', 'thesis', 'project', 'semester', 'specialization', 'electives', 'seminar', 'major', 'study', 'learn', 'practical', 'theory'];
        const coursesKeyHits = coursesKeywords.filter(k => (form.prepCoursesText || '').toLowerCase().includes(k)).length;
        const repeatsProgramOnly = form.targetProgram && 
          (form.prepCoursesText || '').toLowerCase().includes(form.targetProgram.toLowerCase()) && 
          coursesKeyHits <= 1 && 
          coursesLen < 15;

        let coursesScore = 0;
        if (coursesLen > 0) {
          if (coursesLen <= 15) coursesScore = 30;
          else if (coursesLen <= 35) coursesScore = 50;
          else if (coursesLen <= 65) coursesScore = 70;
          else coursesScore = 85;

          coursesScore += Math.min(coursesKeyHits * 4, 20);
          
          if (repeatsProgramOnly) {
            coursesScore = Math.max(coursesScore - 20, 20);
          }
          
          const goalKeywords = ['goal', 'future', 'career', 'aspiration', 'aim', 'prepare', 'specialize', 'interest'];
          const goalKeyHits = goalKeywords.filter(k => (form.prepCoursesText || '').toLowerCase().includes(k)).length;
          if (goalKeyHits > 0) coursesScore += 5;

          coursesScore = Math.min(coursesScore, 100);
        }

        let coursesLevel = 'Vague';
        let coursesFeedback = 'Very general statement. Specify course modules, curriculum structures, and how they relate to your goals.';
        if (coursesScore >= 80) {
          coursesLevel = 'Highly Detailed';
          coursesFeedback = 'Outstanding! You have researched specific syllabus details and connected course options directly to your career goals.';
        } else if (coursesScore >= 60) {
          coursesLevel = 'Specific';
          coursesFeedback = 'Clear mention of subject areas, but would benefit from naming exact modules or academic specialties.';
        } else if (coursesScore >= 40) {
          coursesLevel = 'General';
          coursesFeedback = 'Vague description. Avoid simply saying you will study your major; identify specific subjects or courses.';
        }

        const acadLifeLen = (form.prepAcadLifeText || '').trim().split(/\s+/).filter(Boolean).length;
        const classroomWords = ['lecture', 'seminar', 'tutorial', 'teaching', 'professor', 'faculty', 'classroom', 'interactive'];
        const discussionWords = ['participation', 'discuss', 'discussion', 'debate', 'active', 'speak up', 'presentation', 'group'];
        const workloadWords = ['workload', 'independent', 'self-study', 'reading', 'assignment', 'homework', 'deadline', 'critical'];
        const assessmentWords = ['assessment', 'exam', 'test', 'grading', 'gpa', 'essay', 'project', 'evaluat'];
        
        const hasClassroom = classroomWords.some(w => (form.prepAcadLifeText || '').toLowerCase().includes(w));
        const hasDiscussion = discussionWords.some(w => (form.prepAcadLifeText || '').toLowerCase().includes(w));
        const hasWorkload = workloadWords.some(w => (form.prepAcadLifeText || '').toLowerCase().includes(w));
        const hasAssessment = assessmentWords.some(w => (form.prepAcadLifeText || '').toLowerCase().includes(w));
        
        const categoryHits = [hasClassroom, hasDiscussion, hasWorkload, hasAssessment].filter(Boolean).length;
        const acadLifeKeywords = [...classroomWords, ...discussionWords, ...workloadWords, ...assessmentWords];
        const acadLifeKeyHits = acadLifeKeywords.filter(k => (form.prepAcadLifeText || '').toLowerCase().includes(k)).length;

        let acadLifeScore = 0;
        if (acadLifeLen > 0) {
          if (acadLifeLen <= 15) acadLifeScore = 30;
          else if (acadLifeLen <= 45) acadLifeScore = 55;
          else if (acadLifeLen <= 75) acadLifeScore = 72;
          else acadLifeScore = 85;

          acadLifeScore += categoryHits * 6;
          acadLifeScore += Math.min(acadLifeKeyHits * 2, 10);
          acadLifeScore = Math.min(acadLifeScore, 100);
        }

        let acadLifeLevel = 'Generic Assumptions';
        let acadLifeFeedback = 'Based on common assumptions. Research specific classroom dynamics, workload expectation, and teaching styles.';
        if (acadLifeScore >= 80) {
          acadLifeLevel = 'Meaningful Understanding';
          acadLifeFeedback = 'Superb insights! You demonstrate clear knowledge of teaching styles, grading systems, and self-directed study culture.';
        } else if (acadLifeScore >= 60) {
          acadLifeLevel = 'Reasonably Researched';
          acadLifeFeedback = 'Good understanding of the workload and active participation norms, though a bit generic in places.';
        } else if (acadLifeScore >= 40) {
          acadLifeLevel = 'Basic Understanding';
          acadLifeFeedback = 'Basic awareness of classes, but lacks detail on assessment structures and independent study expectations.';
        }

        const prepScore = Math.round((countryScore + coursesScore + acadLifeScore) / 3);

        // Weighted composite
        const overall = Math.round(
          essayScore * 0.20 +
          fitScore * 0.20 +
          completenessScore * 0.15 +
          scholarshipScore * 0.10 +
          compScore * 0.15 +
          prepScore * 0.20
        );

        const dimensions = [
          { label: 'Essay Persuasiveness', weight: '20%', score: essayScore, icon: '✍️', desc: essayScore >= 75 ? 'Strong narrative with clear motivation and impact.' : essayScore >= 50 ? 'Good content but needs stronger STAR structure and keywords.' : 'Essay needs significant improvement. Aim for 300+ words with clear goals.' },
          { 
            label: 'Profile-Program Fit', 
            weight: '20%', 
            score: fitScore, 
            icon: '🎯', 
            desc: fitScore >= 75 
              ? `${isUndergrad ? 'Report card' : 'GPA'} and English scores align well with target program requirements.` 
              : fitScore >= 50 
                ? `Moderate fit. Strengthening IELTS or ${isUndergrad ? 'academic grades' : 'GPA'} will significantly improve chances.` 
                : `Profile-program alignment is weak. Consider English prep before applying.` 
          },
          { label: 'Completeness & Eligibility', weight: '15%', score: completenessScore, icon: '📋', desc: completenessScore >= 80 ? 'Application profile is well-documented.' : 'Fill in all required fields for a complete profile assessment.' },
          { label: 'Scholarship Match', weight: '10%', score: scholarshipScore, icon: '💰', desc: scholarshipScore >= 70 ? 'Strong scholarship match based on your profile and target award.' : 'Explore merit-based and need-based scholarships for your destination country.' },
          { label: 'Competitiveness', weight: '15%', score: compScore, icon: '🏆', desc: compScore >= 70 ? 'Standout profile with strong extracurriculars and experience.' : 'Add leadership roles, research, or community work to differentiate yourself.' },
          { label: 'Social & Academic Preparedness', weight: '20%', score: prepScore, icon: '🎓', desc: prepScore >= 80 ? 'Demonstrates strong, specific, and well-researched understanding of the environment, courses, and academic life.' : prepScore >= 60 ? 'Reasonable preparedness but still needs to improve specificity and depth.' : prepScore >= 40 ? 'Basic knowledge but lacks specific understanding of the academic life and courses.' : 'Very limited preparedness. Significant research is needed before applying.' }
        ];

        // STAR Framework analysis of essay
        const starAnalysis = {
          situation: form.essayText.toLowerCase().includes('when') || form.essayText.toLowerCase().includes('background') || form.essayText.toLowerCase().includes('growing up'),
          task: form.essayText.toLowerCase().includes('my goal') || form.essayText.toLowerCase().includes('challenge') || form.essayText.toLowerCase().includes('aimed'),
          action: form.essayText.toLowerCase().includes('i ') && essayLen > 50,
          result: form.essayText.toLowerCase().includes('result') || form.essayText.toLowerCase().includes('achieved') || form.essayText.toLowerCase().includes('impact') || form.essayText.toLowerCase().includes('led to')
        };

        // Improvement Roadmap — prioritized by effort vs impact
        const activePackage = localStorage.getItem("indies_package") || "Platinum";
        const roadmap = [];

        // Essay personal statement recommendation
        let essayDetail = 'Structure your personal statement around Situation → Task → Action → Result. Include at least 5 motivation keywords.';
        if (activePackage === 'Silver') {
          essayDetail += ' Consider upgrading to Gold or Platinum to receive 1-on-1 essay mentoring and critique with scholarship awardee mentors.';
        } else {
          essayDetail += ` Submit your draft to your mentor for the 1-on-1 Essay Mentoring & Critique included in your ${activePackage} package.`;
        }
        if (essayScore < 60) {
          roadmap.push({ priority: 'P1', tag: 'Quick Win', color: '#22c55e', title: 'Rewrite Essay Using STAR Framework', detail: essayDetail, effort: 'Low', impact: 'High' });
        }

        // IELTS course recommendation
        let ieltsDetail = 'Enroll in target training to close the language gap. Most top programs require a minimum 6.5 Overall.';
        if (activePackage === 'Silver') {
          ieltsDetail += ' Your Silver package includes the IELTS Essential Course.';
        } else if (activePackage === 'Gold') {
          ieltsDetail += ' Your Gold package includes the IELTS Masterclass Course.';
        } else {
          ieltsDetail += ' Your Platinum package includes the IELTS Masterclass Pro Course.';
        }
        if (ielts < 6.5) {
          roadmap.push({ priority: 'P1', tag: 'Quick Win', color: '#22c55e', title: 'Boost IELTS Score to 6.5+', detail: ieltsDetail, effort: 'Medium', impact: 'High' });
        }

        // Social & Academic Preparedness adaptation
        let prepDetail = 'Research your target country culture, study classroom dynamics (e.g. active participation, independent workload), and list exact course modules you will take.';
        if (activePackage === 'Silver') {
          prepDetail += ' Consider upgrading to Gold or Platinum to access the UniPrep Course (3-Month Academic Adaptation) for classroom adaptation.';
        } else {
          prepDetail += ` Take advantage of the UniPrep Course (3-Month Academic Adaptation) included in your ${activePackage} package.`;
        }
        if (prepScore < 60) {
          roadmap.push({ priority: 'P2', tag: 'Major Improvement', color: '#3b82f6', title: 'Enhance Social & Academic Preparedness', detail: prepDetail, effort: 'Medium', impact: 'High' });
        }

        if (!hasExtracurricular) {
          roadmap.push({ priority: 'P2', tag: 'Major Improvement', color: '#3b82f6', title: 'Document Extracurricular Activities', detail: 'List leadership roles, volunteer work, competitions, or research projects. Scholarship committees look for well-rounded candidates.', effort: 'Low', impact: 'High' });
        }

        // Scholarship application guidance
        let scholarshipDetail = 'Research merit-based scholarships. ';
        if (activePackage === 'Silver') {
          scholarshipDetail += 'Consider upgrading to Gold or Platinum for 1-on-1 scholarship guidance, or Platinum to access Mock panel interview coaching.';
        } else if (activePackage === 'Gold') {
          scholarshipDetail += 'Use the 1-on-1 Scholarship Application Guidance included in your Gold package. Consider upgrading to Platinum for mock interview panels.';
        } else {
          scholarshipDetail += 'Use the 1-on-1 Scholarship Guidance and mock panel sessions included in your Platinum package.';
        }
        if (!form.financialNeed && scholarshipScore < 60) {
          roadmap.push({ priority: 'P2', tag: 'Major Improvement', color: '#3b82f6', title: 'Identify Scholarship Eligibility', detail: scholarshipDetail, effort: 'Medium', impact: 'High' });
        }

        if (isUndergrad) {
          if (rawAcademicScore < 75) {
            roadmap.push({ priority: 'P3', tag: 'Strategic Investment', color: '#f59e0b', title: 'Strengthen Academic Profile', detail: 'Focus on report card score improvement in your remaining semesters. An 85%+ score significantly improves admission odds at top programs.', effort: 'High', impact: 'High' });
          }
        } else {
          if (rawAcademicScore < 3.0) {
            roadmap.push({ priority: 'P3', tag: 'Strategic Investment', color: '#f59e0b', title: 'Strengthen Academic Profile', detail: 'Focus on GPA improvement in your remaining semesters. A 3.5+ GPA significantly improves admission odds at top programs.', effort: 'High', impact: 'High' });
          }
        }

        if (completenessScore < 80) {
          roadmap.push({ priority: 'P2', tag: 'Major Improvement', color: '#3b82f6', title: 'Complete All Profile Fields', detail: 'Ensure SAT score, work experience, and all personal details are documented for a comprehensive profile review.', effort: 'Low', impact: 'Medium' });
        }

        // Polish and mentoring check
        let reviewDetail = 'Have your SOP reviewed by scholarship awardees or academic advisors.';
        if (activePackage === 'Silver') {
          reviewDetail += ' Upgrade to Gold or Platinum to unlock 1-on-1 mentoring and alumni reviews.';
        } else {
          reviewDetail += ` Utilize the 1-on-1 essay mentoring with alumni mentors included in your ${activePackage} package.`;
        }
        roadmap.push({ priority: 'P4', tag: 'Polish', color: '#8b5cf6', title: 'Get Essay Reviewed by Alumni', detail: reviewDetail, effort: 'Low', impact: 'Medium' });

        // Housing and pre-departure card
        let countryDetail = 'Research the local culture and lifestyle. ';
        if (activePackage === 'Silver') {
          countryDetail += 'Consider upgrading to Gold or Platinum for housing placement support and student community connections.';
        } else {
          countryDetail += ` Utilize the housing placement support and student network connections included in your ${activePackage} package.`;
        }
        if (countryScore < 60 && countryLen > 0) {
          roadmap.push({ priority: 'P2', tag: 'Major Improvement', color: '#3b82f6', title: 'Research Cultural Adaptation', detail: countryDetail, effort: 'Low', impact: 'Medium' });
        }

        const statusLabel = overall >= 80 ? 'Highly Competitive' : overall >= 65 ? 'Competitive' : overall >= 50 ? 'Needs Strengthening' : 'Early Stage';
        const statusColor = overall >= 80 ? '#22c55e' : overall >= 65 ? '#3b82f6' : overall >= 50 ? '#f59e0b' : '#ef4444';

        return { 
          overall, 
          dimensions, 
          starAnalysis, 
          roadmap, 
          statusLabel, 
          statusColor, 
          essayWordCount: essayLen,
          prepScore,
          prepDetails: {
            country: { score: countryScore, level: countryLevel, feedback: countryFeedback },
            courses: { score: coursesScore, level: coursesLevel, feedback: coursesFeedback },
            acadLife: { score: acadLifeScore, level: acadLifeLevel, feedback: acadLifeFeedback }
          }
        };
      };

      const handleAnalyze = () => {
        setLoading(true);
        setTimeout(() => {
          setResult(computeResult());
          setLoading(false);
          setStep(1);
          setActiveTab('overview');
          document.getElementById('scholarship-section').scrollIntoView({ behavior: 'smooth' });
        }, 1800);
      };

      const ScoreRing = ({ score, size = 100 }) => {
        const r = (size / 2) - 10;
        const circ = 2 * Math.PI * r;
        const offset = circ - (score / 100) * circ;
        const color = score >= 75 ? '#22c55e' : score >= 50 ? '#3b82f6' : score >= 30 ? '#f59e0b' : '#ef4444';
        return (
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e2e8f0" strokeWidth="8" />
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="8"
              strokeDasharray={circ} strokeDashoffset={offset}
              strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}
              style={{ transition: 'stroke-dashoffset 1s ease-out' }}
            />
            <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="central"
              fontSize={size * 0.22} fontWeight="800" fill={color}>{score}</text>
          </svg>
        );
      };

      return (
        <div className="scholarship-advisor-wrapper">

          {step === 0 && loading && (
            <div className="sa-form-container" style={{ padding: '6rem 2rem', textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{
                width: '50px',
                height: '50px',
                border: '4px solid rgba(27, 94, 80, 0.1)',
                borderTopColor: 'var(--primary-deep)',
                borderRadius: '50%',
                animation: 'sa-spin 1s linear infinite',
                marginBottom: '1.5rem'
              }}></div>
              <h3 style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--primary-deep)', margin: '0 0 0.5rem 0' }}>Analyzing Scholarship Readiness</h3>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', maxWidth: '420px', margin: 0 }}>Evaluating your academic profile, essay structure, country preparedness, and recommendation roadmap...</p>
            </div>
          )}

          {step === 0 && !loading && (
            <div className="sa-form-container">
              <div className="sa-form-header">
                <span className="sa-badge">🎓 Assessment Tool</span>
                <h3 className="sa-form-title">Scholarship Application Advisor</h3>
                <p className="sa-form-subtitle">Fill in your profile below and get an instant multi-dimensional analysis of your scholarship readiness — based on the same frameworks used by top admissions committees worldwide.</p>
              </div>

              <div className="sa-grid">
                {/* Personal Info */}
                <div className="sa-field-group">
                  <label className="sa-label">Full Name</label>
                  <input id="sa-name" className="sa-input" type="text" placeholder="e.g. Budi Santoso" value={form.name} onChange={e => handleChange('name', e.target.value)} />
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">
                    {form.programLevel === 'undergraduate' ? 'Report Card Score (%)' : 'GPA (out of 4.0)'}
                  </label>
                  <input 
                    id="sa-gpa" 
                    className="sa-input" 
                    type="number" 
                    step={form.programLevel === 'undergraduate' ? '1' : '0.01'} 
                    min="0" 
                    max={form.programLevel === 'undergraduate' ? '100' : '4'} 
                    placeholder={form.programLevel === 'undergraduate' ? 'e.g. 85' : 'e.g. 3.75'} 
                    value={form.gpa} 
                    onChange={e => handleChange('gpa', e.target.value)} 
                  />
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">Target Country</label>
                  <select id="sa-country" className="sa-input" value={form.targetCountry} onChange={e => handleChange('targetCountry', e.target.value)}>
                    <option value="">Select country...</option>
                    {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">Target Program / Field</label>
                  <select id="sa-program" className="sa-input" value={form.targetProgram} onChange={e => handleChange('targetProgram', e.target.value)}>
                    <option value="">Select program...</option>
                    {PROGRAMS.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">Program Level</label>
                  <select id="sa-level" className="sa-input" value={form.programLevel} onChange={e => handleChange('programLevel', e.target.value)}>
                    <option value="undergraduate">Undergraduate (S1)</option>
                    <option value="masters">Masters (S2)</option>
                    <option value="phd">PhD (S3)</option>
                  </select>
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">IELTS Overall Score</label>
                  <input id="sa-ielts" className="sa-input" type="number" step="0.5" min="0" max="9" placeholder="e.g. 7.0" value={form.ieltsScore} onChange={e => handleChange('ieltsScore', e.target.value)} />
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">SAT Score (optional)</label>
                  <input id="sa-sat" className="sa-input" type="number" min="400" max="1600" placeholder="e.g. 1350" value={form.satScore} onChange={e => handleChange('satScore', e.target.value)} />
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">Target Scholarship</label>
                  <select id="sa-scholarship" className="sa-input" value={form.targetScholarship} onChange={e => handleChange('targetScholarship', e.target.value)}>
                    <option value="">Select scholarship...</option>
                    {SCHOLARSHIPS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div className="sa-field-group">
                  <label className="sa-label">Work / Research Experience</label>
                  <input id="sa-work" className="sa-input" type="text" placeholder="e.g. 1 year internship at Google" value={form.workExperience} onChange={e => handleChange('workExperience', e.target.value)} />
                </div>
                <div className="sa-field-group sa-checkbox-group">
                  <label className="sa-label">Financial Need</label>
                  <div className="sa-toggle-wrap">
                    <input id="sa-need" type="checkbox" className="sa-checkbox" checked={form.financialNeed} onChange={e => handleChange('financialNeed', e.target.checked)} />
                    <label htmlFor="sa-need" className="sa-toggle">
                      <span className="sa-toggle-thumb"></span>
                    </label>
                    <span className="sa-toggle-label">{form.financialNeed ? 'Yes — I need financial support' : 'No financial need'}</span>
                  </div>
                </div>
              </div>

              {/* Essay Textarea */}
              <div className="sa-field-group sa-essay-group">
                <label className="sa-label">Personal Statement / Statement of Purpose
                  <span className="sa-word-count">{form.essayText.trim().split(/\s+/).filter(Boolean).length} words</span>
                </label>
                <textarea
                  id="sa-essay"
                  className="sa-input sa-textarea"
                  placeholder="Paste or write your personal statement here. The advisor evaluates your essay using the STAR framework (Situation, Task, Action, Result) and checks for motivation keywords, narrative quality, and alignment with your target program..."
                  value={form.essayText}
                  onChange={e => handleChange('essayText', e.target.value)}
                  rows={7}
                />
              </div>

              {/* Extracurricular */}
              <div className="sa-field-group sa-essay-group">
                <label className="sa-label">Extracurricular Activities & Leadership</label>
                <textarea
                  id="sa-extra"
                  className="sa-input sa-textarea"
                  placeholder="e.g. Student president 2022-2023, volunteer at local NGO, national debate champion..."
                  value={form.extracurricular}
                  onChange={e => handleChange('extracurricular', e.target.value)}
                  rows={3}
                />
              </div>

              {/* Social & Academic Preparedness Questions */}
              <div className="sa-prep-form-header sa-essay-group mb-4" style={{ marginTop: '1.5rem', borderTop: '1px solid var(--border-color)', paddingTop: '1.5rem' }}>

                    <div className="form-group">
                      <label>Equivalent CEFR Level</label>
                      <div className="input-style" style={{ backgroundColor: "#f8fafc", borderColor: "var(--accent-blue)", fontWeight: 600, color: "var(--accent-blue)" }}>
                        {currentLevelData.name} ({currentLevelData.cefr})
                      </div>
                    </div>

                    {/* Target University Requirement Display (Static-ish) */}
                    <div className="form-group">
                      <label>Target University & Minimum English</label>
                      <div className="input-style" style={{ backgroundColor: "#e2e8f0", fontWeight: 600 }}>
                        {config.university} ({config.englishRequirementLabel})
                      </div>
                    </div>

                    {/* Exam Equivalency Display Column */}
                    <div className="form-group">
                      <label>Mapped English Exam Score</label>
                      <div className="input-style" style={{ backgroundColor: "#f8fafc", borderColor: "var(--success-color)", fontWeight: 600, color: "var(--success-color)" }}>
                        {currentLevelData.ielts} Equivalent
                      </div>
                    </div>

                    {/* SAT Input */}
                    <div className="form-group">
                      <label htmlFor="sat-score">Your SAT Score</label>
                      <input 
                        id="sat-score"
                        type="number"
                        className="input-style"
                        value={userInputs.satScore}
                        onChange={(e) => handleInputChange("satScore", e.target.value)}
                      />
                      {errors.satScore && <span className="error-text">{errors.satScore}</span>}
                      <span style={{ fontSize: "0.8rem", color: "var(--text-muted)" }}>
                        Minimum Target: {config.minimumSAT}
                      </span>
                    </div>

                    {/* Report Card Input */}
                    <div className="form-group">
                      <label htmlFor="report-score">Your Report Card Score (GPA %)</label>
                      <input 
                        id="report-score"
                        type="number"
                        className="input-style"
                        value={userInputs.reportScore}
                        onChange={(e) => handleInputChange("reportScore", e.target.value)}
                      />
                      {errors.reportScore && <span className="error-text">{errors.reportScore}</span>}
                      <span style={{ fontSize: "0.8rem", color: "var(--text-muted)" }}>
                        Minimum Target: {config.minimumReportScore}
                      </span>
                    </div>
                  </div>

                  {/* Collapsible Admin/Configuration Panel */}
                  <div style={{ marginTop: "2rem" }}>
                    <div className="config-header">
                      <span style={{ fontWeight: 600, fontSize: "0.95rem" }}>Requirements Configuration</span>
                      <button 
                        className="config-toggle-btn"
                        onClick={() => setIsConfigOpen(!isConfigOpen)}
                      >
                        <Icons.Settings /> {isConfigOpen ? "Hide Config Panel" : "Adjust Requirements"}
                      </button>
                    </div>

                    {isConfigOpen && (
                      <div className="config-panel">
                        <h3 style={{ fontSize: "1rem", fontWeight: 700, marginBottom: "1rem" }}>Modify Requirements & Modeling</h3>
                        <div className="form-grid">
                          <div className="form-group">
                            <label>Target University</label>
                            <input 
                              type="text" 
                              className="input-style" 
                              value={config.university} 
                              onChange={(e) => handleConfigChange("university", e.target.value)}
                            />
                          </div>
                          <div className="form-group">
                            <label>English Requirement Label</label>
                            <input 
                              type="text" 
                              className="input-style" 
                              value={config.englishRequirementLabel} 
                              onChange={(e) => handleConfigChange("englishRequirementLabel", e.target.value)}
                            />
                          </div>
                          <div className="form-group">
                            <label>Target WSE Level</label>
                            <select 
                              className="input-style" 
                              value={config.targetWseLevel} 
                              onChange={(e) => handleConfigChange("targetWseLevel", e.target.value)}
                            >
                              {config.levels.map(l => (
                                <option key={l.level} value={l.level}>Level {l.level}</option>
                              ))}
                            </select>
                          </div>
                          <div className="form-group">
                            <label>Months Per WSE Level</label>
                            <input 
                              type="number" 
                              className="input-style" 
                              value={config.monthsPerLevel} 
                              onChange={(e) => handleConfigChange("monthsPerLevel", e.target.value)}
                            />
                          </div>
                          <div className="form-group">
                            <label>Minimum SAT Requirement</label>
                            <input 
                              type="number" 
                              className="input-style" 
                              value={config.minimumSAT} 
                              onChange={(e) => handleConfigChange("minimumSAT", e.target.value)}
                            />
                          </div>
                          <div className="form-group">
                            <label>Min Report Card Requirement</label>
                            <input 
                              type="number" 
                              className="input-style" 
                              value={config.minimumReportScore} 
                              onChange={(e) => handleConfigChange("minimumReportScore", e.target.value)}
                            />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </section>

                {/* Column 2: Dashboard Real-Time Results Output */}
                <section className="results-container">
                  {/* Overall Progress Circle/Visual */}
                  <div className="card" style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
                    <h3 style={{ fontSize: "1.1rem", fontWeight: 700, color: "var(--text-muted)", marginBottom: "1rem" }}>
                      Eligibility Match Status
                    </h3>
                    <div style={{ position: "relative", width: "120px", height: "120px", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: "1rem" }}>
                      <svg width="120" height="120" viewBox="0 0 120 120" style={{ transform: "rotate(-90deg)" }}>
                        <circle cx="60" cy="60" r="50" fill="transparent" stroke="var(--border-color)" strokeWidth="10" />
                        <circle 
                          cx="60" 
                          cy="60" 
                          r="50" 
                          fill="transparent" 
                          stroke={allMet ? "var(--success-color)" : matchPercentage > 33 ? "var(--warning-color)" : "var(--danger-color)"} 
                          strokeWidth="10" 
                          strokeDasharray="314"
                          strokeDashoffset={314 - (314 * matchPercentage) / 100}
                          style={{ transition: "stroke-dashoffset 0.8s ease-in-out" }}
                        />
                      </svg>
                      <span style={{ position: "absolute", fontSize: "1.5rem", fontWeight: 800 }}>
                        {matchPercentage}%
                      </span>
                    </div>
                    <p style={{ fontWeight: 600, fontSize: "0.95rem" }}>
                      {metRequirements} of {totalRequirements} requirements met
                    </p>
                  </div>

                  {/* Status Case UI outputs */}
                  {statusCase === "ALL_MET" && (
                    <div className="status-card status-success">
                      <div className="status-header">
                        <Icons.Check />
                        <span className="status-title">You're on track!</span>
                      </div>
                      <p className="status-description"><strong>Status:</strong> Requirements Matched</p>
                      <p>Congratulations! Your current profile meets or exceeds all admission requirements for the <strong>{config.university}</strong>.</p>
                    </div>
                  )}

                  {statusCase === "ENGLISH_ONLY_UNMET" && (
                    <div className="status-card status-warning">
                      <div className="status-header">
                        <Icons.Info />
                        <span className="status-title">You're not there yet — but you have a clear path.</span>
                      </div>
                      <p className="status-description"><strong>Still needed:</strong> {englishGap} WSE levels</p>
                      <p className="status-description"><strong>Estimated learning time:</strong> Approximately {estimatedMonths} months</p>
                      
                      <div className="pathway-container">
                        <h4 style={{ fontSize: "0.85rem", fontWeight: 700, margin: "1rem 0 0.5rem 0" }}>Learning Roadmap:</h4>
                        <div className="pathway-roadmap">
                          <div className="pathway-step current">
                            <span className="pathway-step-label">Current</span>
                            <div className="pathway-step-badge">Lvl {userInputs.currentLevel}</div>
                            <span className="pathway-step-sub">{currentLevelData.ielts}</span>
                          </div>

                          <div className="pathway-connector">
                            <div className="pathway-connector-line">
                              <div className="pathway-connector-progress"></div>
                            </div>
                            <div className="pathway-connector-badge">
                              +{englishGap} {englishGap === 1 ? 'Level' : 'Levels'}
                            </div>
                            <span className="pathway-connector-subtext">~{estimatedMonths} {estimatedMonths === 1 ? 'month' : 'months'}</span>
                          </div>

                          <div className="pathway-step target">
                            <span className="pathway-step-label">Target</span>
                            <div className="pathway-step-badge">Lvl {config.targetWseLevel}</div>
                            <span className="pathway-step-sub">{config.englishRequirementLabel.replace("Overall", "").trim()}</span>
                          </div>
                        </div>
                      </div>
                      <p style={{ fontSize: "0.85rem", fontStyle: "italic", marginTop: "0.5rem" }}>
                        *At an estimated pace of 1 level every {config.monthsPerLevel} months, reaching your target may take approximately {estimatedMonths} months. Based on the current education progress model.
                      </p>
                    </div>
                  )}

                  {statusCase === "SAT_ONLY_UNMET" && (
                    <div className="status-card status-danger">
                      <div className="status-header">
                        <Icons.X />
                        <span className="status-title">SAT score still needs improvement.</span>
                      </div>
                      <p className="status-description">You are <strong>{satGap} points</strong> below the minimum requirement.</p>
                      <p>You have already cleared the English proficiency hurdle! With targeted practice on the SAT math and reading sections, you're closer than you think to closing the remaining {satGap} points gap.</p>
                    </div>
                  )}

                  {statusCase === "REPORT_ONLY_UNMET" && (
                    <div className="status-card status-danger">
                      <div className="status-header">
                        <Icons.X />
                        <span className="status-title">Your report card score is below the current requirement.</span>
                      </div>
                      <p className="status-description">You need approximately <strong>{reportGap} more points</strong> to meet the current requirement.</p>
                      <p>Your English proficiency and SAT scores are excellent! Try discussing academic improvement paths with your teachers to boost your average report card score to the {config.minimumReportScore} target threshold.</p>
                    </div>
                  )}

                  {statusCase === "MULTIPLE_UNMET" && (
                    <div className="status-card status-danger">
                      <div className="status-header">
                        <Icons.X />
                        <span className="status-title">You still have a few requirements to work on.</span>
                      </div>
                      <p className="status-description">Let's see what you need to improve to reach your university goals.</p>
                      
                      <div style={{ marginTop: "1rem" }}>
                        <h4 style={{ fontSize: "0.85rem", fontWeight: 700, margin: "0.5rem 0" }}>Priority Areas:</h4>
                        <ol style={{ fontSize: "0.9rem", paddingLeft: "1.25rem", display: "flex", flexDirection: "column", gap: "0.5rem" }}>
                          {!isEnglishMet && (
                            <li>
                              <strong>English Level ({englishGap} levels gap):</strong> Reaching Level {config.targetWseLevel} is the highest priority. Estimated study time: ~{estimatedMonths} months.
                            </li>
                          )}
                          {!isSatMet && (
                            <li>
                              <strong>SAT Preparation ({satGap} points gap):</strong> Work on mock papers to elevate your current score from {userInputs.satScore} to {config.minimumSAT}.
                            </li>
                          )}
                          {!isReportMet && (
                            <li>
                              <strong>Report Card Average ({reportGap}% gap):</strong> Improve semester grading scores to reach a minimum of {config.minimumReportScore}%.
                            </li>
                          )}
                        </ol>
                      </div>
                    </div>
                  )}

                  {/* Checklist details */}
                  <div className="card">
                    <h3 className="card-title" style={{ fontSize: "1.1rem" }}><Icons.Check /> Requirement Details</h3>
                    <ul className="checklist">
                      <li className="checklist-item">
                        <span className="checklist-icon" style={{ color: isEnglishMet ? "var(--success-color)" : "var(--danger-color)" }}>
                          {isEnglishMet ? <Icons.Check /> : <Icons.X />}
                        </span>
                        <div>
                          <strong>English Level: </strong> 
                          {isEnglishMet 
                            ? `Cleared (Lvl ${userInputs.currentLevel} meets Target Lvl ${config.targetWseLevel})` 
                            : `Lvl ${userInputs.currentLevel} of Target Lvl ${config.targetWseLevel} (${config.englishRequirementLabel})`
                          }
                        </div>
                      </li>
                      <li className="checklist-item">
                        <span className="checklist-icon" style={{ color: isSatMet ? "var(--success-color)" : "var(--danger-color)" }}>
                          {isSatMet ? <Icons.Check /> : <Icons.X />}
                        </span>
                        <div>
                          <strong>SAT Score: </strong> 
                          {userInputs.satScore} (Min requirement: {config.minimumSAT})
                          {!isSatMet && <span style={{ marginLeft: "0.5rem", color: "var(--danger-color)" }}>(Needs {satGap} pts)</span>}
                        </div>
                      </li>
                      <li className="checklist-item">
                        <span className="checklist-icon" style={{ color: isReportMet ? "var(--success-color)" : "var(--danger-color)" }}>
                          {isReportMet ? <Icons.Check /> : <Icons.X />}
                        </span>
                        <div>
                          <strong>Report Card: </strong> 
                          {userInputs.reportScore}% (Min requirement: {config.minimumReportScore}%)
                          {!isReportMet && <span style={{ marginLeft: "0.5rem", color: "var(--danger-color)" }}>(Needs {reportGap}%)</span>}
                        </div>
                      </li>
                    </ul>
                  </div>
                </section>
              </main>
            </>
          )}

          {currentView === 'journey' && (
            <>
              <header className="hero">
                <div className="hero-content">
                  <h1>INDIES Student Journey & Package Tracker</h1>
                  <p>Explore the A-Z steps of the INDIES admission roadmap and track your progress in real-time.</p>
                </div>
              </header>
              <div className="main-container" style={{ display: 'block', maxWidth: '1200px', margin: '0 auto', padding: '2rem 1rem 6rem 1rem' }}>
                <section className="levels-section" style={{ marginTop: 0, padding: 0 }}>
                  <StudentJourneyTracker userInputs={userInputs} config={config} />
                </section>
              </div>
            </>
          )}

          {currentView === 'levels' && (
            <>
              <header className="hero">
                <div className="hero-content">
                  <h1>Understand WSE Level Check</h1>
                  <p>Explore Wall Street English level progression, CEFR mapping bands, and IELTS equivalents (Levels 1 to 20).</p>
                </div>
              </header>
              <div className="main-container" style={{ display: 'block', maxWidth: '1000px', margin: '0 auto', padding: '2rem 1rem 6rem 1rem' }}>
                <section className="levels-section" style={{ marginTop: 0, padding: 0 }}>
                  
                  {/* WSE Level Scale Table */}
                  <div className="wse-scale-container">
                    <div className="wse-scale-header">
                      <div>CEFR Band & Category</div>
                      <div>WSE Levels</div>
                      <div>Mapped Exam Equivalent</div>
                    </div>

                    {[
                      { name: "Mastery", cefr: "CEFR C1", color: "#0f172a", levels: [18, 19, 20], exams: "IELTS 7.0 - 7.5" },
                      { name: "Milestone", cefr: "CEFR B2", color: "#0284c7", levels: [14, 15, 16, 17], exams: "IELTS 6.0 - 7.0" },
                      { name: "Threshold", cefr: "CEFR B1", color: "#06b6d4", levels: [10, 11, 12, 13], exams: "IELTS 5.0 - 6.0" },
                      { name: "Upper Waystage", cefr: "CEFR A2", color: "#ef4444", levels: [6, 7, 8, 9], exams: "IELTS 4.0 - 5.0" },
                      { name: "Waystage", cefr: "CEFR A1", color: "#f87171", levels: [4, 5], exams: "IELTS 3.5 - 4.0" },
                      { name: "Survival", cefr: "CEFR < A1", color: "#fdba74", levels: [1, 2, 3], exams: "IELTS 3.0 - 3.5" }
                    ].map(band => (
                      <div 
                        key={band.name} 
                        className="wse-scale-row" 
                        style={{ borderLeft: `5px solid ${band.color}`, paddingLeft: "1rem" }}
                      >
                        <div className="wse-band-info">
                          <span className="wse-band-name">{band.name}</span>
                          <span className="wse-band-cefr">{band.cefr}</span>
                        </div>
                        <div className="wse-level-blocks">
                          {band.levels.map(lvl => {
                            const isSelected = userInputs.currentLevel === lvl;
                            const isTarget = config.targetWseLevel === lvl;
                            return (
                              <button 
                                key={lvl} 
                                onClick={() => handleLevelCardClick(lvl)}
                                className={`wse-level-btn ${isSelected ? 'active' : ''} ${isTarget ? 'target' : ''}`}
                                title={`Click to set your current level as Level ${lvl}`}
                                style={{
                                  borderColor: isSelected 
                                    ? "var(--accent-blue)" 
                                    : isTarget 
                                      ? "var(--success-color)" 
                                      : "var(--border-color)"
                                }}
                              >
                                {lvl}
                              </button>
                            );
                          })}
                        </div>
                        <div className="wse-band-exams">
                          {band.exams}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Selected Level Detail Display Card */}
                  <div className="level-detail-card card" style={{ marginTop: "2rem", borderLeft: "5px solid var(--accent-blue)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: "1rem", marginBottom: "1rem" }}>
                      <div>
                        <span className="level-badge" style={{ marginBottom: "0.5rem" }}>
                          Selected Level: Level {currentLevelData.level}
                        </span>
                        <h3 style={{ fontSize: "1.5rem", fontWeight: 800, color: "var(--primary-deep)" }}>
                          {currentLevelData.name} ({currentLevelData.cefr})
                        </h3>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <span className="level-badge" style={{ backgroundColor: "var(--success-bg)", color: "var(--success-color)" }}>
                          Equivalency: {currentLevelData.ielts}
                        </span>
                      </div>
                    </div>
                    
                    <p style={{ color: "var(--text-muted)", fontSize: "1.05rem", marginBottom: "1.5rem", fontWeight: 400 }}>
                      {currentLevelData.description}
                    </p>
                    
                    <h4 className="level-skills-title" style={{ fontSize: "0.9rem", color: "var(--primary-deep)" }}>
                      Standard Learning Abilities
                    </h4>
                    <ul className="level-skills-list" style={{ marginTop: "0.5rem" }}>
                      {currentLevelData.abilities.map((ability, idx) => (
                        <li key={idx} style={{ fontSize: "0.95rem" }}>{ability}</li>
                      ))}
                    </ul>
                  </div>
                </section>
              </div>
            </>
          )}

          {/* Footer */}
          <footer>
            <div className="footer-logo">WSE Pathway</div>
            <p>© {new Date().getFullYear()} WSE Pathway. Built to empower language learning targets and academic eligibility mapping.</p>
          </footer>
        </div>
      );
    }

    // Render React root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

  </script>
</body>
</html>
